<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Page Not Found — Coovix</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .not-found { min-height: 100vh; display: grid; place-items: center; padding: 7rem 1.5rem 3rem; background: #fff; text-align: center; }
        .not-found-inner { width: min(720px,100%); }
        .not-found-icon { width: 90px; height: 90px; display: grid; place-items: center; margin: 0 auto 1.5rem; border-radius: 26px; color: #fff; background: #0099d8; box-shadow: 0 20px 45px rgba(0,153,216,.24); font-size: 2rem; }
        .not-found strong { color: #0099d8; font-size: clamp(4.5rem,14vw,9rem); line-height: 1; }
        .not-found h1 { margin: .8rem 0; color: #153f54; font-size: clamp(2rem,5vw,3.8rem); }
        .not-found p { max-width: 560px; margin: 0 auto 2rem; color: #718b97; line-height: 1.8; }
        .not-found-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: .8rem; }
        .not-found-actions a { display: inline-flex; align-items: center; gap: .6rem; padding: .95rem 1.3rem; border: 1px solid #cbe5ef; border-radius: 999px; color: #17455b; text-decoration: none; font-weight: 700; }
        .not-found-actions a:first-child { color: #fff; border-color: #0099d8; background: #0099d8; }
    </style>
</head>
<body>
    <main class="not-found"><div class="not-found-inner"><span class="not-found-icon"><i class="fas fa-compass"></i></span><strong>404</strong><h1>This page could not be found.</h1><p>The page may have moved or the address may be incorrect. Return home or explore our latest digital projects.</p><div class="not-found-actions"><a href="index.html">Return home <i class="fas fa-arrow-right"></i></a><a href="Projects/projects-index.html">View projects</a></div></div></main>
</body>
</html>
