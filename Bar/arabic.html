<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جارٍ التحميل…</title>
    <style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif;color:#123f54;background:#f7fcff}p{font-weight:700}</style>
</head>
<body>
    <p>جارٍ التحميل…</p>
    <script>
        fetch('./arabic.php')
            .then(function (response) { if (!response.ok) throw new Error(); return response.text(); })
            .then(function (html) {
                var staticPreview = html
                    .replace(/<\?php[\s\S]*?\?>/g, '')
                    .replace(/kurdish\.php/g, 'kurdish.html')
                    .replace(/arabic\.php/g, 'arabic.html')
                    .replace(/index\.php/g, 'index.html');
                document.open(); document.write(staticPreview); document.close();
            })
            .catch(function () { document.body.innerHTML = '<p>تعذر تحميل الصفحة.</p>'; });
    </script>
</body>
</html>
