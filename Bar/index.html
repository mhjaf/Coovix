<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Barber Demo…</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Arial, sans-serif; color: #123f54; background: #f7fcff; }
        p { font-weight: 700; }
    </style>
</head>
<body>
    <p>Loading Barber Demo…</p>
    <script>
        fetch('./index.php')
            .then(function (response) {
                if (!response.ok) throw new Error('Unable to load the Barber demo.');
                return response.text();
            })
            .then(function (html) {
                var staticPreview = html
                    .replace(/<\?php[\s\S]*?\?>/g, '')
                    .replace(/kurdish\.php/g, 'kurdish')
                    .replace(/arabic\.php/g, 'arabic')
                    .replace(/index\.php/g, 'index');
                document.open();
                document.write(staticPreview);
                document.close();
            })
            .catch(function () {
                document.body.innerHTML = '<p>Unable to load the Barber demo.</p>';
            });
    </script>
</body>
</html>
